<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Hero Card</title>
</head>
<style>
    body{
        background-color: blanchedalmond;
    }
    .heroname{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-size: 60px;
        text-decoration: wavy;
        color: yellow;
        text-shadow: 3px 3px gray;
    }
    .tagline{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-size: 20px;
        text-decoration: wavy;
        color: coral;
    }
    .label{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-weight: bold;
        color: rgb(red, green, blue);
    }
    .power{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        color: burlywood ;
        text-decoration: wavy;
        font-weight: bold;
    }
    .weakness{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        color: deeppink;
        font-weight: bold;
        text-decoration: dotted;
    }


</style>
<body>
    
    <main>
        <h1 class="hero-name"> Spiderman</h1>
        <p class="tagline">This is the most powerful hero in the super hero industry</p>
        <h2 class="label">Powers</h2>
        <p class="power">It can shoot web</p>
        <h2 class="label">Weakness</h2>
        <p class="weakness">Its weakness is food</p>
    </main>
</body>
</html>
