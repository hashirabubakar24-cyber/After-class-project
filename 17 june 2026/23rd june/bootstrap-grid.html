<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="crossorigin">
    <style>
        body{
            background-color: #f9f9f9;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 10px;
        }
        h1{
            text-align: center;
            color: green;
        }
        .container{
            background-color: yellow;
            align-items: center;
            border-radius: 3px;
        }
        .hobby-card{
            text-align: center;
            border: 1px solid orange;
            border-radius: 4px;
            margin-bottom: 20px;
            padding: 20px;
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <h1>My Hobby Cards</h1>
    <div class="container">
        <div class="row">
            <div class="box">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I can draw on paper and do colours.</p>
                    <img height="250px" width="250px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRWlfvPpyyZeWIsno9ar-Dn5MHcef7UD6WJQ&s" alt="">
                </div>
                    <div class="hobby-card">
                        <h3>Reading</h3>
                        <p>I like reading fictional books.</p>
                    </div>
                        <div class="hobby-card">
                            <h3>Cycling</h3>
                            <p>I ride on cycle for miles.</p>



                </div>

            </div>

        </div>

    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
