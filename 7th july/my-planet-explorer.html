<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>My Planet Explorer</title>
</head>
<style>
    body{
        background-color: #f0f4ff;
    }
    .navbar{
        background-color: #1a237e;
    }
    .navbar-brand{
        color: #fff;
    }
    .navlink{
        color: #fff;
    }
    .section-title{
        color: #1a237e;
        margin: 20px 0 10px;
    }
</style>
<body>
    <nav class="navbar navbar-expand-sm">
        <a class="navbar-brand" href="#">Planet Explorer</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Stars</a></li>
        </ul>
    </nav>
    <div class="container mt-4">
        <h4 class="section-title">Scanning The Galaxy...</h4>
        <div class="spinner-border text-primary" role="status"></div>
        <div class="spinner-border text-warning" role="status"></div>
        <div class="spinner-border text-danger" role="status"></div>
        <h4 class="section-title">Featured Planets</h4>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Earth</h5>
                        <p class="card-text">Our home planet! The only one known to have life.</p>
                        <a href="#" class="btn btn-primary">Explore</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Mars</h5>
                        <p class="card-text">The red planet! One day the humans may live here.</p>
                        <a href="#" class="btn btn-danger">Explore</a>
                    </div>
                </div>
            </div>
        </div>
            <h4 class="section-title">Browse More Planets</h4>
  <ul class="pagination">
    <li class="page-item"><a class="page-link" href="#">Previous</a></li>
    <li class="page-item"><a class="page-link" href="#">1</a></li>
    <li class="page-item"><a class="page-link" href="#">2</a></li>
    <li class="page-item"><a class="page-link" href="#">3</a></li>
    <li class="page-item"><a class="page-link" href="#">Next</a></li>
  </ul>

        </div>

    </div>
</body>
</html>
