<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black white;
        }
        .animal-title{
            font-size: 30px;
            text-decoration: underline;
            color: forestgreen;
            padding-bottom: 25px;
        }
        .animal-box{
            background-color: lightyellow;
            width: 280px;
            margin: 50px;
            border: 3px solid;
            padding: 30px;
            border-radius: 4px;
        }
        .details{
            color:blue ;
        }
        .cool-fact{
            color: darkorange;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="animal-box">
    <h2 class="animal-title">Snow Leopard</h2>
    <p class="details">Type: Big Cat</p>
    <p class="details">Lives In: Mountains of central Asia</p>
    <p class="details">Food: Deer Goat and white sheep</p>
    <p class="cool-fact">Fun Fact: They can leap over 15 meters in one jump</p>
    </div>
</body>
</html>
