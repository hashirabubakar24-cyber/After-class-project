<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title></title>
</head>
<body>
    <div class="jumbotron">
        <h1 class="display-4">Science Lab</h1>
        <p class="lead">We do different experiments here and research on science subjects.</p>
        <p>Here are different subjects mentioned:</p>
        <a class="btn btn-info btn-lg" href="#">Biology</a>
        <a class="btn btn-info btn-lg" href="#">Physics</a>
        <a class="btn btn-info btn-lg" href="#">Chemistry</a>
        <a class="btn btn-info btn-lg" href="#">Computer</a>

    </div>
    <div class="container">
        <h3>Experimentations completed</h3>
        <button type="button" class="btn btn-primary">
  Physics <span class="badge badge-light">9</span>
  <span class="sr-only">unread messages</span>
</button>
<button type="button" class="btn btn-primary">
  Physics <span class="badge badge-light">5</span>
  <span class="sr-only">unread messages</span>
</button>
<button type="button" class="btn btn-primary">
  Chemistry <span class="badge badge-light">4</span>
  <span class="sr-only">unread messages</span>
</button>
<button type="button" class="btn btn-primary">
  Computer <span class="badge badge-light">2</span>
  <span class="sr-only">unread messages</span>
</button>

</div>
<div style="padding: 15px;">

    <h3>Research Progress</h3>
    <p>Biology</p>
    <div class="progress">
  <div class="progress-bar bg-success" role="progressbar" style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<p>Physics</p>
<div class="progress">
  <div class="progress-bar bg-info" role="progressbar" style="width: 50%" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<p>Chemistry</p>
<div class="progress">
  <div class="progress-bar bg-warning" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<p>Computer</p>
<div class="progress">
  <div class="progress-bar bg-danger" role="progressbar" style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
</div>
</div>
</div>
</body>
</html>
