<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ordered list</h2>
    <ol>
    <li>sugar</li>
    <li>milk</li>
    <li>water</li>
    <li>salt</li>
    <li>ketchup</li>
    </ol>
    <h2>Unordered list</h2>
    <ul>
        <li>running</li>
        <li>playing football</li>
        <li>swimming</li>
        <li>racing</li>
    </ul>
    <h2>Description list</h2>
    <dl>
        <dt>Milk</dt>
        <dd>white colour</dd>
        <dt>Tea</dt>
        <dd>hot drink</dd>
    </dl>

    <table border="2px">
        <th>Students age</th>
        <th>Roll number</th>
        <tr>
            <td>18</td>
            <td>12356</td>
            <tr>


    </table>
</body>
</html>
